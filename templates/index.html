<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزیدنسی ۲۴ | مشاوره اقامت، ویزا و سرمایه‌گذاری امارات</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>رزیدنسی ۲۴</h1>
            <p>مشاوره اقامت، ویزا، ثبت شرکت و خرید ملک در امارات</p>
            <button id="resetBtn" class="reset-btn">مکالمه جدید</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    سلام! من دستیار رزیدنسی ۲۴ هستم. در زمینه ویزا و اقامت امارات، ثبت شرکت و خرید ملک می‌تونم راهنماییتون کنم. چطور می‌تونم کمکتون کنم؟
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <form id="chatForm">
                <input
                    type="text"
                    id="userInput"
                    placeholder="سوال خود را بنویسید..."
                    autocomplete="off"
                >
                <button type="submit" id="sendBtn">ارسال</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
